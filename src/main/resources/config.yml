resource-pack:
  url: "" # 配布先の URL (空なら送らない)
  hash: "" # 任意（更新検知用）
  prompt: "サーバー専用リソースパックを適用してください。"
  force: true

# 参加した直後に、重いポストエフェクトを先にコンパイルしておく (画面を黒くして、読み込み画面のダイアログを出す。数秒)。
# ゲーム中に初めて出た時の画面の固まりを避ける。リソースパックを入れた人にだけ働く
shader-warmup:
  enabled: true

# レイド終盤の演出 (残り秒数)。予告 → 予兆 (サイレン・照明弾・空が色づく) → EMP 起爆 → 時間切れで MIA
raid-end-sequence:
  warning-seconds: 180
  precursor-seconds: 90
  emp-seconds: 45

hit-sounds:
  headshot: "custom_hit"
  penetration-success: "ENTITY_ZOMBIE_ATTACK_IRON_DOOR"
  penetration-failed: "ITEM_ARMOR_EQUIP_IRON"

ai_log:
  enabled: true
  sample_interval_ticks: 5
  capture_raycast: false
  max_raid_logs: 50
  async_write: true

# 管理用スポーン診断。満タン開始・指定重量の基準ペース（スキルなし）。
raid-spawn-diagnostics:
  # 以下は共通移動倍率を掛ける前の基準値。MovementTuningを別途適用する。
  speed-blocks-per-second: 5.6
  walk-speed-blocks-per-second: 4.3
  reference-weight-grams: 20000
  food-level: 20
  stamina-reserve: 5
  # 既存チャンクのみ非同期読込。総数超過なら診断を開始しない。
  chunk-margin-blocks: 32
  max-chunks: 2048
  parallel-chunk-loads: 2
  urgent-seconds: 15
  target-min-seconds: 30
  target-max-seconds: 40
  # 退避0方向で、この高低差以上の上層スポーンがあれば地下・立体通路候補とする。
  underground-height-difference: 3
  # 調べ切れない時は安全判定にしない。未生成チャンクは生成しない。
  max-nodes-per-pair: 6000
  # 全地点ペアを対象にする。負荷はtick予算・制限時間で制限する。
  max-contact-checks: 4096
  max-path-blocks: 1024
  max-duration-seconds: 120
  operations-per-tick: 48
  millis-per-tick: 2

# 銃声による集合を抑制。視認・被弾・人数枠を使う正式な援護参加には適用しない。
scav-hearing:
  gunshot-investigate-radius: 32
  gunshot-alert-radius: 64
  sound-home-radius: 40

# クライアントの日本語無線。危険区域は /raid danger add でWorldEdit選択からマップに保存する。
raid-radio:
  enabled: true

# SCAV死体の短時間ラグドール。新しいリソースパックの部位モデルが必要。
scav-ragdoll:
  enabled: true
  debug: false
  max-active: 6
  max-corpses: 64
  max-animation-ticks: 48
  millis-per-tick: 3

# 薬品工場の高脅威区域に登録したボス1人＋護衛2人。通常SCAVとは別の抽選。
raid-boss:
  enabled: true
  map-id: "ノヴォザリエ薬品工場"
  chance: 0.125 # 1レイドにつき1回。0～1、範囲外・非有限値は出現なし。

# 診断 (読み取り専用)。gun-trace: 銃のアニメーションの異常 (止まる・モデルが消える) を、異常の時だけ plugins/<プラグイン>/gun-trace/日付.log に履歴つきで書く
diagnostics:
  gun-trace: true

# 通知の既定言語。受信者の言語に翻訳がない場合に使う。
messages:
  default-language: ja_jp
